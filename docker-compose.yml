services:
  backend-api:
    build: ./backend
    env_file:
      - .env
    ports:
      - "5001:5000"
    networks:
      - app-network
    volumes:
      - ./backend:/app
      - ./data:/app/data
    environment:
      - EXCEL_FILE_PATH=/app/data/Portfolio.xlsx
      - PYTHONUNBUFFERED=1

  frontend-web:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend-api
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
